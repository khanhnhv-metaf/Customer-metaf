<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>차량 및 객실 조회</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif;
      background: #EEF2F7;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    .header {
      background: #1A3557;
      padding: 28px 20px 70px;
      text-align: center;
    }
    .header-title {
      color: #fff;
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.4;
    }
    .header-sub {
      color: rgba(255,255,255,0.5);
      font-size: 0.78rem;
      margin-top: 8px;
      line-height: 1.7;
    }

    /* ── SEARCH CARD ── */
    .search-card {
      position: sticky;
      top: 0;
      z-index: 20;
      margin: -46px 16px 0;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(26,53,87,0.13);
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .search-icon { color: #94a3b8; font-size: 1.05rem; flex-shrink: 0; }
    #searchInput {
      flex: 1;
      border: none;
      outline: none;
      font-size: 1rem;
      color: #0f172a;
      background: transparent;
      min-width: 0;
    }
    #searchInput::placeholder { color: #b0bec5; }
    #searchInput:disabled { color: #b0bec5; }
    #clearBtn {
      flex-shrink: 0;
      width: 26px; height: 26px;
      border: none;
      border-radius: 50%;
      background: #f1f5f9;
      color: #64748b;
      font-size: 0.7rem;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    #clearBtn:hover { background: #fee2e2; color: #dc2626; }

    /* ── CONTENT ── */
    .content { padding: 16px 16px 48px; }

    /* ── STATES ── */
    .state-box {
      text-align: center;
      padding: 52px 20px;
      color: #94a3b8;
      font-size: 0.9rem;
      line-height: 2;
    }
    .state-box .ico { font-size: 2.6rem; display: block; margin-bottom: 6px; }

    /* ── STATS ── */
    .stats {
      font-size: 0.74rem;
      color: #94a3b8;
      text-align: right;
      margin-bottom: 10px;
    }

    /* ── RESULT CARD ── */
    .result-item {
      background: #fff;
      border-radius: 16px;
      margin-bottom: 10px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .ri-top {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #f1f5f9;
    }
    .ri-name-ko {
      font-size: 1.2rem;
      font-weight: 700;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .ri-name-vn {
      font-size: 0.82rem;
      color: #64748b;
      margin-top: 3px;
    }

    .ri-bottom {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .ri-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
    }
    .ri-badge:first-child { border-right: 1px solid #f1f5f9; }

    .ri-badge-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .ri-badge-icon.car  { background: #EEF2FF; }
    .ri-badge-icon.room { background: #F0FDF4; }

    .ri-badge-label {
      font-size: 0.63rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 3px;
    }
    .ri-badge-value {
      font-size: 1.05rem;
      font-weight: 800;
      color: #0f172a;
      line-height: 1;
    }
    .ri-badge-value.muted { font-size: 0.82rem; font-weight: 500; color: #94a3b8; }

    .gpill {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      flex-shrink: 0;
    }
    .gpill.M { background: #dbeafe; color: #1d4ed8; }
    .gpill.F { background: #fce7f3; color: #be185d; }

    mark {
      background: #fef08a;
      border-radius: 2px;
      padding: 0 1px;
    }

    .footer {
      text-align: center;
      font-size: 0.7rem;
      color: #cbd5e1;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-title">🔍 차량 및 객실 조회</div>
  <div class="header-sub">한국어 이름으로 차량 번호와 방 번호를 확인하세요</div>
</div>

<div class="search-card">
  <span class="search-icon">🔍</span>
  <input id="searchInput" type="text"
    placeholder="이름을 입력하세요 (예: 강경배)"
    disabled autocomplete="off" autocorrect="off" spellcheck="false" />
  <button id="clearBtn" onclick="clearSearch()">✕</button>
</div>

<div class="content">
  <div id="results">
    <div class="state-box">
      <span class="ico">⏳</span>
      데이터 로딩 중…
    </div>
  </div>
  <div class="footer" id="totalInfo"></div>
</div>

<script>
  let allPeople = [];

  fetch('data.json')
    .then(r => { if (!r.ok) throw new Error('data.json 파일을 찾을 수 없습니다'); return r.json(); })
    .then(data => {
      allPeople = data;
      document.getElementById('searchInput').disabled = false;
      document.getElementById('searchInput').focus();
      setEmpty();
      document.getElementById('totalInfo').textContent = '전체: ' + allPeople.length + '명';
    })
    .catch(err => {
      document.getElementById('results').innerHTML =
        '<div class="state-box" style="color:#ef4444">❌ ' + err.message + '</div>';
    });

  const input = document.getElementById('searchInput');
  input.addEventListener('input', () => {
    const q = input.value.trim();
    document.getElementById('clearBtn').style.display = q ? 'flex' : 'none';
    renderResults(q);
  });

  function clearSearch() {
    input.value = '';
    document.getElementById('clearBtn').style.display = 'none';
    setEmpty();
    input.focus();
  }

  function setEmpty() {
    document.getElementById('results').innerHTML =
      '<div class="state-box"><span class="ico">🔎</span>이름을 입력하세요</div>';
  }

  function norm(s) { return s.trim().toUpperCase().replace(/\s+/g, ' '); }

  function renderResults(query) {
    const container = document.getElementById('results');
    if (!query) { setEmpty(); return; }

    const q = norm(query);
    const matched = allPeople.filter(p =>
      norm(p.korName).includes(q) || norm(p.vnName).includes(q)
    );

    if (matched.length === 0) {
      container.innerHTML =
        '<div class="state-box"><span class="ico">😕</span>검색 결과가 없습니다</div>';
      return;
    }

    const stats = '<div class="stats">검색결과: <b>' + matched.length + '</b>명</div>';

    const items = matched.map(p => {
      const gender = (p.gender === 'M' || p.gender === 'F')
        ? '<span class="gpill ' + p.gender + '">' + (p.gender === 'M' ? '남' : '여') + '</span>'
        : '';

      const roomVal = p.room
        ? '<div class="ri-badge-value">' + p.room + '</div>'
        : '<div class="ri-badge-value muted">미정</div>';

      return '<div class="result-item">'
        + '<div class="ri-top">'
        +   '<div class="ri-name-ko">' + hl(p.korName, q) + gender + '</div>'
        +   '<div class="ri-name-vn">' + hl(p.vnName, q) + '</div>'
        + '</div>'
        + '<div class="ri-bottom">'
        +   '<div class="ri-badge">'
        +     '<div class="ri-badge-icon car">🚌</div>'
        +     '<div class="ri-badge-text">'
        +       '<div class="ri-badge-label">차량</div>'
        +       '<div class="ri-badge-value">' + p.carNum + '호차</div>'
        +     '</div>'
        +   '</div>'
        +   '<div class="ri-badge">'
        +     '<div class="ri-badge-icon room">🏨</div>'
        +     '<div class="ri-badge-text">'
        +       '<div class="ri-badge-label">방 번호</div>'
        +       roomVal
        +     '</div>'
        +   '</div>'
        + '</div>'
        + '</div>';
    }).join('');

    container.innerHTML = stats + items;
  }

  function hl(text, query) {
    if (!text) return '';
    const idx = text.toUpperCase().indexOf(query);
    if (idx === -1) return text;
    return text.slice(0, idx)
      + '<mark>' + text.slice(idx, idx + query.length) + '</mark>'
      + text.slice(idx + query.length);
  }
</script>
</body>
</html>
